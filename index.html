<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta de Clima Laboral</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>¿Tenemos un buen clima laboral?</h1>
        
        <form id="encuestaForm">
            <div class="form-group">
                <label for="nombre">Nombre de la persona encuestada:</label>
                <input type="text" id="nombre" name="nombre" required placeholder="Ingresa tu nombre completo">
            </div>

            <div id="contenedor-preguntas"></div>

            <button type="submit">Enviar Encuesta</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
